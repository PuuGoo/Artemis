name: Restore Artemis gear source
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/gear-safety-patch.yml
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Restore last complete game source
        run: |
          git checkout b06d68b4b5a28603b2ea2af575e991191d88c9ca -- index.html
          rm -f scripts/gear-safety-patch.mjs
          rm -f .github/workflows/gear-safety-patch.yml
      - name: Commit restored source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Restore complete Artemis game source"
          git push origin HEAD:main
