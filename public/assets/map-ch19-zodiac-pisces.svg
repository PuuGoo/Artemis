<path d="M0,460 Q260,400 520,480 T1200,430 V600 H0Z" fill="url(#ground)"/>
<path d="M0,510 Q270,455 530,515 T1200,495" fill="none" stroke="#5eead4" stroke-opacity=".3" stroke-width="7"/>
<g><path d="M39,600 L46,310 L74,250 L102,310 L109,600Z" fill="url(#tower)" stroke="#c084fc" stroke-opacity=".45" stroke-width="2"/><path d="M234,600 L241,390 L269,330 L297,390 L304,600Z" fill="url(#tower)" stroke="#c084fc" stroke-opacity=".45" stroke-width="2"/><path d="M869,600 L876,398 L904,338 L932,398 L939,600Z" fill="url(#tower)" stroke="#c084fc" stroke-opacity=".45" stroke-width="2"/><path d="M1070,600 L1077,429 L1105,369 L1133,429 L1140,600Z" fill="url(#tower)" stroke="#c084fc" stroke-opacity=".45" stroke-width="2"/></g><ellipse cx="600" cy="560" rx="440" ry="55" fill="#5eead4" opacity=".16" filter="url(#blur)"/>
