<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Bản đồ Chương 18: Hải Đài Thiên Thủy">
<defs>
 <linearGradient id="sky" x2="1" y2="1"><stop stop-color="#0e3150"/><stop offset=".55" stop-color="#11152c"/><stop offset="1" stop-color="#040714"/></linearGradient>
 <radialGradient id="aura"><stop stop-color="#22d3ee" stop-opacity=".5"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
 <radialGradient id="moon"><stop stop-color="#fff"/><stop offset=".4" stop-color="#818cf8"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
 <linearGradient id="tower" x2="0" y2="1"><stop stop-color="#22d3ee" stop-opacity=".8"/><stop offset=".4" stop-color="#0e3150"/><stop offset="1" stop-color="#050814"/></linearGradient>
 <linearGradient id="ground" x2="0" y2="1"><stop stop-color="#0e3150"/><stop offset="1" stop-color="#03050e"/></linearGradient>
 <radialGradient id="sigil"><stop stop-color="#818cf8" stop-opacity=".55"/><stop offset="1" stop-color="#818cf8" stop-opacity="0"/></radialGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter><filter id="halo"><feGaussianBlur stdDeviation="5"/></filter>
</defs>
<style>
 @keyframes twinkle{50%{opacity:.35}} @keyframes orbit{to{transform:rotate(360deg)}} @keyframes float{50%{transform:translateY(-14px)}} @keyframes breathe{50%{opacity:.5;transform:scale(1.08)}}
 .twinkle{animation:twinkle 2.8s ease-in-out infinite alternate} .orbit{transform-origin:600px 265px;animation:orbit 36s linear infinite} .float{animation:float 5s ease-in-out infinite} .breathe{transform-origin:600px 265px;animation:breathe 4s ease-in-out infinite}
 @media (prefers-reduced-motion:reduce){.twinkle,.orbit,.float,.breathe{animation:none}}
</style>
<rect width="1200" height="600" fill="url(#sky)"/>
<ellipse class="breathe" cx="600" cy="265" rx="460" ry="290" fill="url(#aura)"/>
<circle cx="600" cy="265" r="178" fill="url(#sigil)"/>
<g class="float"><circle cx="600" cy="265" r="118" fill="none" stroke="#818cf8" stroke-opacity=".6" stroke-width="3"/><circle cx="600" cy="265" r="145" fill="none" stroke="#22d3ee" stroke-opacity=".35" stroke-width="1.5" stroke-dasharray="7 14"/><text x="600" y="310" fill="#fff" fill-opacity=".88" text-anchor="middle" font-size="145" font-family="serif">♒</text></g>
<g class="orbit" fill="none" stroke="#22d3ee" stroke-opacity=".45"><ellipse cx="600" cy="265" rx="245" ry="120" transform="rotate(-22 600 265)" stroke-width="2"/><ellipse cx="600" cy="265" rx="290" ry="155" transform="rotate(27 600 265)" stroke-width="1"/></g>
