<path d="M0,460 Q260,400 520,480 T1200,430 V600 H0Z" fill="url(#ground)"/>
<path d="M0,510 Q270,455 530,515 T1200,495" fill="none" stroke="#22d3ee" stroke-opacity=".3" stroke-width="7"/>
<g><path d="M69,600 L76,381 L104,321 L132,381 L139,600Z" fill="url(#tower)" stroke="#818cf8" stroke-opacity=".45" stroke-width="2"/><path d="M255,600 L262,378 L290,318 L318,378 L325,600Z" fill="url(#tower)" stroke="#818cf8" stroke-opacity=".45" stroke-width="2"/><path d="M878,600 L885,320 L913,260 L941,320 L948,600Z" fill="url(#tower)" stroke="#818cf8" stroke-opacity=".45" stroke-width="2"/><path d="M1037,600 L1044,341 L1072,281 L1100,341 L1107,600Z" fill="url(#tower)" stroke="#818cf8" stroke-opacity=".45" stroke-width="2"/></g><ellipse cx="600" cy="560" rx="440" ry="55" fill="#22d3ee" opacity=".16" filter="url(#blur)"/>
