<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Bản đồ Chương 12: Thánh Điện Nhật Luân">
<defs>
 <linearGradient id="sky" x2="1" y2="1"><stop stop-color="#46260f"/><stop offset=".55" stop-color="#11152c"/><stop offset="1" stop-color="#040714"/></linearGradient>
 <radialGradient id="aura"><stop stop-color="#fbbf24" stop-opacity=".5"/><stop offset="1" stop-color="#fbbf24" stop-opacity="0"/></radialGradient>
 <radialGradient id="moon"><stop stop-color="#fff"/><stop offset=".4" stop-color="#fb923c"/><stop offset="1" stop-color="#fbbf24" stop-opacity="0"/></radialGradient>
 <linearGradient id="tower" x2="0" y2="1"><stop stop-color="#fbbf24" stop-opacity=".8"/><stop offset=".4" stop-color="#46260f"/><stop offset="1" stop-color="#050814"/></linearGradient>
 <linearGradient id="ground" x2="0" y2="1"><stop stop-color="#46260f"/><stop offset="1" stop-color="#03050e"/></linearGradient>
 <radialGradient id="sigil"><stop stop-color="#fb923c" stop-opacity=".55"/><stop offset="1" stop-color="#fb923c" stop-opacity="0"/></radialGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter><filter id="halo"><feGaussianBlur stdDeviation="5"/></filter>
</defs>
<style>
 @keyframes twinkle{50%{opacity:.35}} @keyframes orbit{to{transform:rotate(360deg)}} @keyframes float{50%{transform:translateY(-14px)}} @keyframes breathe{50%{opacity:.5;transform:scale(1.08)}}
 .twinkle{animation:twinkle 2.8s ease-in-out infinite alternate} .orbit{transform-origin:600px 265px;animation:orbit 36s linear infinite} .float{animation:float 5s ease-in-out infinite} .breathe{transform-origin:600px 265px;animation:breathe 4s ease-in-out infinite}
 @media (prefers-reduced-motion:reduce){.twinkle,.orbit,.float,.breathe{animation:none}}
</style>
<rect width="1200" height="600" fill="url(#sky)"/>
<ellipse class="breathe" cx="600" cy="265" rx="460" ry="290" fill="url(#aura)"/>
<circle cx="600" cy="265" r="178" fill="url(#sigil)"/>
<g class="float"><circle cx="600" cy="265" r="118" fill="none" stroke="#fb923c" stroke-opacity=".6" stroke-width="3"/><circle cx="600" cy="265" r="145" fill="none" stroke="#fbbf24" stroke-opacity=".35" stroke-width="1.5" stroke-dasharray="7 14"/><text x="600" y="310" fill="#fff" fill-opacity=".88" text-anchor="middle" font-size="145" font-family="serif">♌</text></g>
<g class="orbit" fill="none" stroke="#fbbf24" stroke-opacity=".45"><ellipse cx="600" cy="265" rx="245" ry="120" transform="rotate(-22 600 265)" stroke-width="2"/><ellipse cx="600" cy="265" rx="290" ry="155" transform="rotate(27 600 265)" stroke-width="1"/></g>
<g class="twinkle"><circle cx="127" cy="49" r="3" fill="#fff" opacity=".8"/><circle cx="1084" cy="188" r="3" fill="#fff" opacity=".6"/><circle cx="911" cy="78" r="3" fill="#fff" opacity=".5"/><circle cx="307" cy="62" r="4" fill="#fff" opacity=".8"/><circle cx="405" cy="292" r="4" fill="#fff" opacity=".7"/><circle cx="704" cy="120" r="3" fill="#fff" opacity=".8"/><circle cx="535" cy="346" r="3" fill="#fff" opacity=".5"/><circle cx="934" cy="75" r="3" fill="#fff" opacity=".9"/><circle cx="334" cy="101" r="4" fill="#fff" opacity=".7"/><circle cx="590" cy="129" r="4" fill="#fff" opacity=".8"/><circle cx="1028" cy="158" r="2" fill="#fff" opacity=".9"/></g><path d="M663,365 L527,393 L383,308 L451,214 L520,164 L686,136 L746,221 L784,315" fill="none" stroke="#fb923c" stroke-opacity=".55" stroke-width="2"/><circle cx="663" cy="365" r="8" fill="#fbbf24" filter="url(#halo)"/><circle cx="663" cy="365" r="3.5" fill="#fff"/><circle cx="527" cy="393" r="8" fill="#fbbf24" filter="url(#halo)"/><circle cx="527" cy="393" r="3.5" fill="#fff"/><circle cx="383" cy="308" r="8" fill="#fbbf24" filter="url(#halo)"/><circle cx="383" cy="308" r="3.5" fill="#fff"/><circle cx="451" cy="214" r="8" fill="#fbbf24" filter="url(#halo)"/><circle cx="451" cy="214" r="3.5" fill="#fff"/><circle cx="520" cy="164" r="8" fill="#fbbf24" filter="url(#halo)"/><circle cx="520" cy="164" r="3.5" fill="#fff"/><circle cx="686" cy="136" r="8" fill="#fbbf24" filter="url(#halo)"/><circle cx="686" cy="136" r="3.5" fill="#fff"/><circle cx="746" cy="221" r="8" fill="#fbbf24" filter="url(#halo)"/><circle cx="746" cy="221" r="3.5" fill="#fff"/><circle cx="784" cy="315" r="8" fill="#fbbf24" filter="url(#halo)"/><circle cx="784" cy="315" r="3.5" fill="#fff"/>
<g opacity=".45"><path d="M-60,600 Q400,300 1200,100" fill="none" stroke="#fb923c" stroke-opacity=".12" stroke-width="12"/><path d="M90,600 Q500,283 1280,138" fill="none" stroke="#fbbf24" stroke-opacity=".12" stroke-width="19"/><path d="M240,600 Q600,266 1360,176" fill="none" stroke="#fb923c" stroke-opacity=".12" stroke-width="26"/><path d="M390,600 Q700,249 1440,214" fill="none" stroke="#fbbf24" stroke-opacity=".12" stroke-width="33"/></g>
<path d="M0,460 Q260,400 520,480 T1200,430 V600 H0Z" fill="url(#ground)"/>
<path d="M0,510 Q270,455 530,515 T1200,495" fill="none" stroke="#fbbf24" stroke-opacity=".3" stroke-width="7"/>
<g><path d="M43,600 L50,351 L78,291 L106,351 L113,600Z" fill="url(#tower)" stroke="#fb923c" stroke-opacity=".45" stroke-width="2"/><path d="M256,600 L263,360 L291,300 L319,360 L326,600Z" fill="url(#tower)" stroke="#fb923c" stroke-opacity=".45" stroke-width="2"/><path d="M861,600 L868,341 L896,281 L924,341 L931,600Z" fill="url(#tower)" stroke="#fb923c" stroke-opacity=".45" stroke-width="2"/><path d="M1082,600 L1089,375 L1117,315 L1145,375 L1152,600Z" fill="url(#tower)" stroke="#fb923c" stroke-opacity=".45" stroke-width="2"/></g><ellipse cx="600" cy="560" rx="440" ry="55" fill="#fbbf24" opacity=".16" filter="url(#blur)"/>
<g class="float" fill="none" stroke="#fff" stroke-opacity=".27" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M150 480 Q210 330 290 385 Q330 430 275 475 M1050 480 Q990 330 910 385 Q870 430 925 475 M170 375 L130 335 M230 340 L225 290 M1030 375 L1070 335 M970 340 L975 290"/></g></svg>