    <linearGradient id="c3ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#150a2a"/>
      <stop offset="55%" stop-color="#0b0518"/>
      <stop offset="100%" stop-color="#04020a"/>
    </linearGradient>
    <linearGradient id="c3tower" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0a0418"/>
      <stop offset="50%" stop-color="#1d0f38"/>
