      <stop offset="50%" stop-color="#c084fc" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0"/>
    </linearGradient>
    <filter id="c3soft" x="-40%" y="-40%" width="180%" height="180%">
