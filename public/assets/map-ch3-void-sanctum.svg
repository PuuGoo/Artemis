<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Void sanctum fortress">
  <defs>
    <linearGradient id="c3sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#080312"/>
      <stop offset="30%" stop-color="#170a2e"/>
      <stop offset="58%" stop-color="#2b1052"/>
      <stop offset="82%" stop-color="#3f1466"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
    <radialGradient id="c3nebula" cx="0.62" cy="0.3" r="0.42">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.4"/>
      <stop offset="55%" stop-color="#7c3aed" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#4c1d95" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="c3moon" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#f5e6ff" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#c4b5fd" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="c3far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a1250"/>
      <stop offset="100%" stop-color="#170a2e"/>
    </linearGradient>
    <linearGradient id="c3mid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c0c38"/>
      <stop offset="100%" stop-color="#0e0620"/>
