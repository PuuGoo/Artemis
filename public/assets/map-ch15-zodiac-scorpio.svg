<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Bản đồ Chương 15: Hoang Mạc Độc Tinh">
<defs>
 <linearGradient id="sky" x2="1" y2="1"><stop stop-color="#32152e"/><stop offset=".55" stop-color="#11152c"/><stop offset="1" stop-color="#040714"/></linearGradient>
 <radialGradient id="aura"><stop stop-color="#c084fc" stop-opacity=".5"/><stop offset="1" stop-color="#c084fc" stop-opacity="0"/></radialGradient>
 <radialGradient id="moon"><stop stop-color="#fff"/><stop offset=".4" stop-color="#fb7185"/><stop offset="1" stop-color="#c084fc" stop-opacity="0"/></radialGradient>
 <linearGradient id="tower" x2="0" y2="1"><stop stop-color="#c084fc" stop-opacity=".8"/><stop offset=".4" stop-color="#32152e"/><stop offset="1" stop-color="#050814"/></linearGradient>
 <linearGradient id="ground" x2="0" y2="1"><stop stop-color="#32152e"/><stop offset="1" stop-color="#03050e"/></linearGradient>
 <radialGradient id="sigil"><stop stop-color="#fb7185" stop-opacity=".55"/><stop offset="1" stop-color="#fb7185" stop-opacity="0"/></radialGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter><filter id="halo"><feGaussianBlur stdDeviation="5"/></filter>
</defs>
<style>
 @keyframes twinkle{50%{opacity:.35}} @keyframes orbit{to{transform:rotate(360deg)}} @keyframes float{50%{transform:translateY(-14px)}} @keyframes breathe{50%{opacity:.5;transform:scale(1.08)}}
 .twinkle{animation:twinkle 2.8s ease-in-out infinite alternate} .orbit{transform-origin:600px 265px;animation:orbit 36s linear infinite} .float{animation:float 5s ease-in-out infinite} .breathe{transform-origin:600px 265px;animation:breathe 4s ease-in-out infinite}
 @media (prefers-reduced-motion:reduce){.twinkle,.orbit,.float,.breathe{animation:none}}
</style>
<rect width="1200" height="600" fill="url(#sky)"/>
<ellipse class="breathe" cx="600" cy="265" rx="460" ry="290" fill="url(#aura)"/>
<circle cx="600" cy="265" r="178" fill="url(#sigil)"/>
