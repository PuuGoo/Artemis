<g><path d="M84,600 L91,388 L119,328 L147,388 L154,600Z" fill="url(#tower)" stroke="#fb7185" stroke-opacity=".45" stroke-width="2"/><path d="M279,600 L286,342 L314,282 L342,342 L349,600Z" fill="url(#tower)" stroke="#fb7185" stroke-opacity=".45" stroke-width="2"/><path d="M855,600 L862,337 L890,277 L918,337 L925,600Z" fill="url(#tower)" stroke="#fb7185" stroke-opacity=".45" stroke-width="2"/><path d="M1031,600 L1038,433 L1066,373 L1094,433 L1101,600Z" fill="url(#tower)" stroke="#fb7185" stroke-opacity=".45" stroke-width="2"/></g><ellipse cx="600" cy="560" rx="440" ry="55" fill="#c084fc" opacity=".16" filter="url(#blur)"/>
