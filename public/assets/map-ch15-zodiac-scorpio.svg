<g class="orbit" fill="none" stroke="#c084fc" stroke-opacity=".45"><ellipse cx="600" cy="265" rx="245" ry="120" transform="rotate(-22 600 265)" stroke-width="2"/><ellipse cx="600" cy="265" rx="290" ry="155" transform="rotate(27 600 265)" stroke-width="1"/></g>
