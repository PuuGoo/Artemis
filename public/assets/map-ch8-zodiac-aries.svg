<path d="M0,510 Q270,455 530,515 T1200,495" fill="none" stroke="#fb7185" stroke-opacity=".3" stroke-width="7"/>
<g><path d="M75,600 L82,327 L110,267 L138,327 L145,600Z" fill="url(#tower)" stroke="#f97316" stroke-opacity=".45" stroke-width="2"/><path d="M236,600 L243,328 L271,268 L299,328 L306,600Z" fill="url(#tower)" stroke="#f97316" stroke-opacity=".45" stroke-width="2"/><path d="M842,600 L849,285 L877,225 L905,285 L912,600Z" fill="url(#tower)" stroke="#f97316" stroke-opacity=".45" stroke-width="2"/><path d="M1042,600 L1049,337 L1077,277 L1105,337 L1112,600Z" fill="url(#tower)" stroke="#f97316" stroke-opacity=".45" stroke-width="2"/></g><ellipse cx="600" cy="560" rx="440" ry="55" fill="#fb7185" opacity=".16" filter="url(#blur)"/>
