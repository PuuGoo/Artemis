<g opacity=".45"><path d="M-60,600 Q400,300 1200,100" fill="none" stroke="#fbbf24" stroke-opacity=".12" stroke-width="12"/><path d="M90,600 Q500,283 1280,138" fill="none" stroke="#a5b4fc" stroke-opacity=".12" stroke-width="19"/><path d="M240,600 Q600,266 1360,176" fill="none" stroke="#fbbf24" stroke-opacity=".12" stroke-width="26"/><path d="M390,600 Q700,249 1440,214" fill="none" stroke="#a5b4fc" stroke-opacity=".12" stroke-width="33"/></g>
<path d="M0,460 Q260,400 520,480 T1200,430 V600 H0Z" fill="url(#ground)"/>
<path d="M0,510 Q270,455 530,515 T1200,495" fill="none" stroke="#a5b4fc" stroke-opacity=".3" stroke-width="7"/>
<g><path d="M89,600 L96,269 L124,209 L152,269 L159,600Z" fill="url(#tower)" stroke="#fbbf24" stroke-opacity=".45" stroke-width="2"/><path d="M260,600 L267,375 L295,315 L323,375 L330,600Z" fill="url(#tower)" stroke="#fbbf24" stroke-opacity=".45" stroke-width="2"/><path d="M875,600 L882,299 L910,239 L938,299 L945,600Z" fill="url(#tower)" stroke="#fbbf24" stroke-opacity=".45" stroke-width="2"/><path d="M1054,600 L1061,338 L1089,278 L1117,338 L1124,600Z" fill="url(#tower)" stroke="#fbbf24" stroke-opacity=".45" stroke-width="2"/></g><ellipse cx="600" cy="560" rx="440" ry="55" fill="#a5b4fc" opacity=".16" filter="url(#blur)"/>
<g class="float" fill="none" stroke="#fff" stroke-opacity=".27" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M120 500 L300 300 M250 300 L300 300 L300 350 M145 490 Q155 410 230 360 M1080 500 L900 300 M950 300 L900 300 L900 350 M1055 490 Q1045 410 970 360"/></g></svg>