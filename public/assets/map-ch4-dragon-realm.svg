    <path d="M210 325 Q230 355 218 580 L274 580 Q254 390 284 325Z"/>
    <path d="M900 295 Q930 345 915 590 L972 590 Q958 380 984 295Z"/>
    <path d="M1040 355 Q1060 390 1058 580 L1090 580 Q1080 420 1100 355Z"/>
  </g>
