  <path d="M293 357 Q370 314 430 324 Q505 279 570 307 Q652 260 736 310 Q827 298 873 352" fill="none" stroke="#ecfeff" stroke-opacity=".65" stroke-width="7" stroke-linecap="round"/>
  <path d="M330 390 Q420 420 498 391 Q620 430 718 388 Q812 405 862 369 L790 474 680 520 536 508 420 478Z" fill="url(#rock)"/>
  <path d="M438 440 Q425 494 392 560 L465 535 514 453Z" fill="url(#water)" opacity=".8"/>
  <path d="M744 435 Q765 482 798 560 L845 529 804 411Z" fill="url(#water)" opacity=".65"/>
  <!-- crystal spires and terraces -->
  <g stroke="#cffafe" stroke-width="2">
    <path d="M338 324 L367 258 397 323Z" fill="#22d3ee" fill-opacity=".75"/><path d="M378 320 L405 276 428 326Z" fill="#a5f3fc" fill-opacity=".55"/>
    <path d="M757 312 L793 235 824 318Z" fill="#38bdf8" fill-opacity=".8"/><path d="M806 322 L842 268 867 338Z" fill="#67e8f9" fill-opacity=".6"/>
    <path d="M488 319 L510 280 533 315Z" fill="#7dd3fc" fill-opacity=".65"/>
  </g>
  <g fill="none" stroke="#fbbf24" stroke-opacity=".7" stroke-width="3">
    <path d="M330 364 Q420 340 492 363"/><path d="M672 357 Q755 338 850 369"/>
    <path d="M420 400 Q560 430 690 397"/>
  </g>
  <!-- dragon temple -->
  <g>
    <ellipse cx="592" cy="300" rx="160" ry="72" fill="url(#rift)" filter="url(#softGlow)"/>
    <path d="M492 323 L492 255 532 255 532 218 560 218 560 190 620 190 620 218 648 218 648 255 688 255 688 323Z" fill="url(#temple)" stroke="#a5f3fc" stroke-width="3"/>
    <path d="M474 258 L592 180 708 258Z" fill="#0e7490" stroke="#fde68a" stroke-width="4"/>
    <path d="M510 254 L592 202 670 254" fill="none" stroke="#ecfeff" stroke-opacity=".8" stroke-width="3"/>
    <path d="M550 323 L550 263 592 239 633 263 633 323Z" fill="#082f49" stroke="#67e8f9" stroke-width="3"/>
    <path d="M572 322 L572 273 Q592 246 612 273 L612 322Z" fill="#020817" stroke="#fbbf24" stroke-width="2"/>
    <path d="M592 182 L592 140 M578 155 L592 136 606 155" fill="none" stroke="url(#gold)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="592" cy="282" r="13" fill="url(#sun)"/><circle cx="592" cy="282" r="5" fill="#fef3c7"/>
    <path d="M530 323 L530 277 M654 323 L654 277" stroke="#fde68a" stroke-width="4"/>
  </g>
  <!-- foreground floating shards -->
  <g>
    <path d="M85 427 L126 333 166 427 144 480 109 488Z" fill="url(#island)" stroke="#67e8f9" stroke-width="2"/>
    <path d="M1020 420 L1060 314 1100 420 1081 475 1045 482Z" fill="url(#island)" stroke="#67e8f9" stroke-width="2"/>
    <path d="M150 465 Q205 430 248 462 L215 520 178 534Z" fill="url(#rock)"/>
    <path d="M945 474 Q1000 430 1045 468 L1024 530 980 536Z" fill="url(#rock)"/>
    <path d="M170 430 Q204 400 237 433" fill="none" stroke="#a5f3fc" stroke-opacity=".65" stroke-width="4"/>
    <path d="M966 432 Q1004 400 1037 438" fill="none" stroke="#a5f3fc" stroke-opacity=".65" stroke-width="4"/>
  </g>
  <!-- mist ribbons -->
  <g fill="none" stroke-linecap="round" filter="url(#mist)" opacity=".45">
    <path d="M-30 470 Q260 400 470 474 T900 455 T1240 470" stroke="#bae6fd" stroke-width="32"/>
    <path d="M-40 520 Q230 452 470 520 T920 502 T1250 526" stroke="#67e8f9" stroke-width="20"/>
  </g>
  <!-- tiny dragon silhouette circling the shrine -->
  <g fill="#082f49" stroke="#a5f3fc" stroke-width="2" opacity=".92">
    <path d="M770 190 Q805 166 831 182 L855 169 845 195 867 211 842 207 828 226 818 205 793 213 805 195Z"/>
    <path d="M806 188 Q790 150 761 157 Q775 178 786 196Z" fill="#0e7490"/>
    <path d="M831 184 Q846 151 872 156 Q858 181 848 196Z" fill="#0e7490"/>
    <path d="M845 193 L866 186 858 202Z" fill="#fde68a" stroke="none"/>
  </g>
  <!-- atmospheric highlights -->
  <g fill="none" stroke="#ecfeff" stroke-opacity=".45">
    <path d="M40 275 Q180 245 300 274"/><path d="M890 390 Q1030 355 1160 384"/>
    <path d="M465 160 Q530 142 596 156"/><path d="M104 205 Q155 188 207 200"/>
  </g>
  <rect width="1200" height="600" fill="url(#horizon)" opacity=".18"/>
</svg>