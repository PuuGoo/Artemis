<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#06162f"/><stop offset=".48" stop-color="#0e4969"/><stop offset="1" stop-color="#102d4d"/></linearGradient>
    <linearGradient id="horizon" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#67e8f9" stop-opacity=".55"/><stop offset="1" stop-color="#1d4ed8" stop-opacity="0"/></linearGradient>
    <linearGradient id="island" x1="0" y1="0" x2=".2" y2="1"><stop stop-color="#a5f3fc"/><stop offset=".18" stop-color="#347c91"/><stop offset=".58" stop-color="#164e63"/><stop offset="1" stop-color="#061a2c"/></linearGradient>
    <linearGradient id="rock" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#164e63"/><stop offset=".5" stop-color="#0b2944"/><stop offset="1" stop-color="#020817"/></linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ecfeff" stop-opacity=".9"/><stop offset=".45" stop-color="#67e8f9" stop-opacity=".55"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fef3c7"/><stop offset=".45" stop-color="#fbbf24"/><stop offset="1" stop-color="#92400e"/></linearGradient>
    <linearGradient id="temple" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#cffafe"/><stop offset=".55" stop-color="#0e7490"/><stop offset="1" stop-color="#082f49"/></linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%"><stop stop-color="#ecfeff" stop-opacity=".95"/><stop offset=".28" stop-color="#67e8f9" stop-opacity=".45"/><stop offset="1" stop-color="#67e8f9" stop-opacity="0"/></radialGradient>
    <radialGradient id="cloudGlow"><stop stop-color="#e0f2fe" stop-opacity=".8"/><stop offset="1" stop-color="#7dd3fc" stop-opacity="0"/></radialGradient>
    <radialGradient id="rift"><stop stop-color="#fef3c7" stop-opacity=".7"/><stop offset=".3" stop-color="#22d3ee" stop-opacity=".3"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="13"/></filter>
    <filter id="mist" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="22"/></filter>
  </defs>
  <rect width="1200" height="600" fill="url(#sky)"/>
  <circle cx="870" cy="132" r="170" fill="url(#sun)"/>
  <circle cx="870" cy="132" r="78" fill="none" stroke="#a5f3fc" stroke-opacity=".2" stroke-width="2"/>
  <circle cx="870" cy="132" r="112" fill="none" stroke="#e0f2fe" stroke-opacity=".12" stroke-dasharray="5 12"/>
  <g fill="#e0f2fe" opacity=".7">
    <circle cx="94" cy="79" r="2"/><circle cx="210" cy="147" r="1.5"/><circle cx="350" cy="54" r="2"/><circle cx="493" cy="118" r="1.5"/>
    <circle cx="615" cy="68" r="2"/><circle cx="1058" cy="74" r="2"/><circle cx="1138" cy="186" r="1.5"/><circle cx="740" cy="212" r="1.2"/>
  </g>
  <g fill="url(#cloudGlow)" filter="url(#mist)" opacity=".9">
    <ellipse cx="180" cy="310" rx="250" ry="75"/><ellipse cx="625" cy="365" rx="310" ry="95"/><ellipse cx="1050" cy="330" rx="270" ry="82"/>
  </g>
