<g opacity=".45"><path d="M-60,600 Q400,300 1200,100" fill="none" stroke="#a5f3fc" stroke-opacity=".12" stroke-width="12"/><path d="M90,600 Q500,283 1280,138" fill="none" stroke="#38bdf8" stroke-opacity=".12" stroke-width="19"/><path d="M240,600 Q600,266 1360,176" fill="none" stroke="#a5f3fc" stroke-opacity=".12" stroke-width="26"/><path d="M390,600 Q700,249 1440,214" fill="none" stroke="#38bdf8" stroke-opacity=".12" stroke-width="33"/></g>
<path d="M0,460 Q260,400 520,480 T1200,430 V600 H0Z" fill="url(#ground)"/>
<path d="M0,510 Q270,455 530,515 T1200,495" fill="none" stroke="#38bdf8" stroke-opacity=".3" stroke-width="7"/>
<g><path d="M37,600 L44,350 L72,290 L100,350 L107,600Z" fill="url(#tower)" stroke="#a5f3fc" stroke-opacity=".45" stroke-width="2"/><path d="M226,600 L233,323 L261,263 L289,323 L296,600Z" fill="url(#tower)" stroke="#a5f3fc" stroke-opacity=".45" stroke-width="2"/><path d="M883,600 L890,362 L918,302 L946,362 L953,600Z" fill="url(#tower)" stroke="#a5f3fc" stroke-opacity=".45" stroke-width="2"/><path d="M1045,600 L1052,363 L1080,303 L1108,363 L1115,600Z" fill="url(#tower)" stroke="#a5f3fc" stroke-opacity=".45" stroke-width="2"/></g><ellipse cx="600" cy="560" rx="440" ry="55" fill="#38bdf8" opacity=".16" filter="url(#blur)"/>
<g class="float" fill="none" stroke="#fff" stroke-opacity=".27" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M105 445 Q190 370 285 440 Q230 420 185 480 M1095 445 Q1010 370 915 440 Q970 420 1015 480 M100 510 Q180 475 280 510 M920 510 Q1020 475 1100 510"/></g></svg>