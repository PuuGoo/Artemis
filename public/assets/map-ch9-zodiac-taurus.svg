<g opacity=".45"><path d="M-60,600 Q400,300 1200,100" fill="none" stroke="#84cc16" stroke-opacity=".12" stroke-width="12"/><path d="M90,600 Q500,283 1280,138" fill="none" stroke="#fbbf24" stroke-opacity=".12" stroke-width="19"/><path d="M240,600 Q600,266 1360,176" fill="none" stroke="#84cc16" stroke-opacity=".12" stroke-width="26"/><path d="M390,600 Q700,249 1440,214" fill="none" stroke="#fbbf24" stroke-opacity=".12" stroke-width="33"/></g>
<path d="M0,460 Q260,400 520,480 T1200,430 V600 H0Z" fill="url(#ground)"/>
<path d="M0,510 Q270,455 530,515 T1200,495" fill="none" stroke="#fbbf24" stroke-opacity=".3" stroke-width="7"/>
<g><path d="M82,600 L89,278 L117,218 L145,278 L152,600Z" fill="url(#tower)" stroke="#84cc16" stroke-opacity=".45" stroke-width="2"/><path d="M259,600 L266,413 L294,353 L322,413 L329,600Z" fill="url(#tower)" stroke="#84cc16" stroke-opacity=".45" stroke-width="2"/><path d="M838,600 L845,393 L873,333 L901,393 L908,600Z" fill="url(#tower)" stroke="#84cc16" stroke-opacity=".45" stroke-width="2"/><path d="M1064,600 L1071,366 L1099,306 L1127,366 L1134,600Z" fill="url(#tower)" stroke="#84cc16" stroke-opacity=".45" stroke-width="2"/></g><ellipse cx="600" cy="560" rx="440" ry="55" fill="#fbbf24" opacity=".16" filter="url(#blur)"/>
