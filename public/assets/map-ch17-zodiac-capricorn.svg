<path d="M0,460 Q260,400 520,480 T1200,430 V600 H0Z" fill="url(#ground)"/>
<path d="M0,510 Q270,455 530,515 T1200,495" fill="none" stroke="#7dd3fc" stroke-opacity=".3" stroke-width="7"/>
<g><path d="M51,600 L58,282 L86,222 L114,282 L121,600Z" fill="url(#tower)" stroke="#e2e8f0" stroke-opacity=".45" stroke-width="2"/><path d="M279,600 L286,377 L314,317 L342,377 L349,600Z" fill="url(#tower)" stroke="#e2e8f0" stroke-opacity=".45" stroke-width="2"/><path d="M879,600 L886,408 L914,348 L942,408 L949,600Z" fill="url(#tower)" stroke="#e2e8f0" stroke-opacity=".45" stroke-width="2"/><path d="M1030,600 L1037,340 L1065,280 L1093,340 L1100,600Z" fill="url(#tower)" stroke="#e2e8f0" stroke-opacity=".45" stroke-width="2"/></g><ellipse cx="600" cy="560" rx="440" ry="55" fill="#7dd3fc" opacity=".16" filter="url(#blur)"/>
