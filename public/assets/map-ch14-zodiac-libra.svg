<g opacity=".45"><path d="M-60,600 Q400,300 1200,100" fill="none" stroke="#fbbf24" stroke-opacity=".12" stroke-width="12"/><path d="M90,600 Q500,283 1280,138" fill="none" stroke="#f0abfc" stroke-opacity=".12" stroke-width="19"/><path d="M240,600 Q600,266 1360,176" fill="none" stroke="#fbbf24" stroke-opacity=".12" stroke-width="26"/><path d="M390,600 Q700,249 1440,214" fill="none" stroke="#f0abfc" stroke-opacity=".12" stroke-width="33"/></g>
<path d="M0,460 Q260,400 520,480 T1200,430 V600 H0Z" fill="url(#ground)"/>
<path d="M0,510 Q270,455 530,515 T1200,495" fill="none" stroke="#f0abfc" stroke-opacity=".3" stroke-width="7"/>
<g><path d="M71,600 L78,366 L106,306 L134,366 L141,600Z" fill="url(#tower)" stroke="#fbbf24" stroke-opacity=".45" stroke-width="2"/><path d="M266,600 L273,362 L301,302 L329,362 L336,600Z" fill="url(#tower)" stroke="#fbbf24" stroke-opacity=".45" stroke-width="2"/><path d="M864,600 L871,365 L899,305 L927,365 L934,600Z" fill="url(#tower)" stroke="#fbbf24" stroke-opacity=".45" stroke-width="2"/><path d="M1041,600 L1048,432 L1076,372 L1104,432 L1111,600Z" fill="url(#tower)" stroke="#fbbf24" stroke-opacity=".45" stroke-width="2"/></g><ellipse cx="600" cy="560" rx="440" ry="55" fill="#f0abfc" opacity=".16" filter="url(#blur)"/>
