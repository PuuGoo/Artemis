  <g fill="#0d1f28" opacity="0.85">
    <path d="M188 460 L196 318 L206 316 L214 460 Z"/>
    <path d="M196 318 L201 286 L206 316 Z" fill="#14313d"/>
    <path d="M1004 460 L1012 352 L1022 350 L1030 460 Z"/>
    <path d="M1012 352 L1017 324 L1022 350 Z" fill="#14313d"/>
  </g>

