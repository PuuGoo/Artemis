  <path d="M0 452 Q300 428 600 444 Q900 460 1200 436 L1200 600 L0 600 Z" fill="url(#c1ground)"/>

  <!-- VÁCH ĐÁ HAI BÊN (tạo khung) -->
  <path d="M0 600 L0 300 L74 316 L122 268 L176 300 L214 372 L246 470 L268 600 Z" fill="#0c1b24"/>
  <path d="M1200 600 L1200 284 L1128 302 L1074 246 L1020 292 L982 366 L950 470 L928 600 Z" fill="#0c1b24"/>
  <path d="M0 300 L74 316 L122 268 L176 300 L214 372 L246 470" fill="none" stroke="#2c5566" stroke-width="2" opacity="0.5"/>
  <path d="M1200 284 L1128 302 L1074 246 L1020 292 L982 366 L950 470" fill="none" stroke="#2c5566" stroke-width="2" opacity="0.5"/>

  <!-- ĐƯỜNG ĐÁ DẪN TỚI CỔNG -->
  <path d="M596 600 Q600 520 606 480 Q612 452 606 430 L594 430 Q588 452 594 480 Q600 520 604 600 Z" fill="#31424d" opacity="0.55"/>
  <g stroke="#415764" stroke-width="1.4" opacity="0.35">
    <path d="M528 596 L648 582"/><path d="M540 560 L660 548"/><path d="M552 524 L672 514"/>
    <path d="M566 490 L684 482"/><path d="M578 462 L692 456"/>
  </g>

  <!-- CỔNG HẦM NGỤC -->
  <g>
    <path d="M520 430 L520 322 Q600 250 680 322 L680 430 Z" fill="#050e15"/>
    <path d="M520 430 L520 322 Q600 250 680 322 L680 430 Z" fill="none" stroke="#3f6577" stroke-width="5"/>
    <path d="M534 430 L534 328 Q600 266 666 328 L666 430 Z" fill="url(#c1gate)"/>
    <!-- khe sáng bên trong -->
    <ellipse cx="600" cy="392" rx="46" ry="30" fill="url(#c1glow)" filter="url(#c1soft)"/>
    <path d="M560 430 L560 356 Q600 322 640 356 L640 430 Z" fill="#0b3346" opacity="0.9"/>
    <!-- trụ cổng -->
    <rect x="506" y="316" width="18" height="118" rx="3" fill="#2a4a58"/>
    <rect x="676" y="316" width="18" height="118" rx="3" fill="#2a4a58"/>
    <rect x="506" y="316" width="18" height="10" rx="2" fill="#3d6a7d"/>
    <rect x="676" y="316" width="18" height="10" rx="2" fill="#3d6a7d"/>
    <!-- khắc đá trên vòm -->
    <path d="M556 330 Q600 300 644 330" fill="none" stroke="#4d7f93" stroke-width="2.6" opacity="0.8"/>
    <circle cx="600" cy="312" r="6" fill="none" stroke="#67e8f9" stroke-width="2" opacity="0.75"/>
  </g>

  <!-- ÁNH SÁNG TỪ CỔNG -->
  <path d="M566 430 L634 430 L700 600 L500 600 Z" fill="url(#c1beam)" filter="url(#c1soft)"/>

  <!-- CỘT ĐÁ GẦN -->
  <g>
    <path d="M300 600 L312 402 L330 398 L344 600 Z" fill="#101f27"/>
    <path d="M312 402 L321 368 L330 398 Z" fill="#1c3540"/>
    <path d="M300 600 L312 402 L330 398 L344 600 Z" fill="none" stroke="#2b4b58" stroke-width="1.6" opacity="0.6"/>
    <path d="M872 600 L886 418 L904 414 L918 600 Z" fill="#101f27"/>
    <path d="M886 418 L895 386 L904 414 Z" fill="#1c3540"/>
    <path d="M872 600 L886 418 L904 414 L918 600 Z" fill="none" stroke="#2b4b58" stroke-width="1.6" opacity="0.6"/>
  </g>

  <!-- ĐÁ NHỎ RẢI RÁC -->
  <g fill="#1d2f38">
    <ellipse cx="386" cy="556" rx="26" ry="9"/>
    <ellipse cx="806" cy="572" rx="32" ry="11"/>
    <ellipse cx="466" cy="596" rx="20" ry="7"/>
    <ellipse cx="726" cy="588" rx="24" ry="8"/>
    <ellipse cx="228" cy="586" rx="30" ry="10"/>
    <ellipse cx="982" cy="560" rx="22" ry="8"/>
