  <rect x="0" y="392" width="1200" height="72" fill="url(#c1fog)"/>
  <rect x="0" y="470" width="1200" height="56" fill="url(#c1fog)" opacity="0.7"/>

  <!-- ĐOM ĐÁY / HẠT SÁNG -->
  <g fill="#a5f3fc">
    <circle cx="356" cy="436" r="2.2" opacity="0.85"/><circle cx="410" cy="470" r="1.6" opacity="0.6"/>
    <circle cx="470" cy="424" r="1.9" opacity="0.75"/><circle cx="700" cy="446" r="2.1" opacity="0.8"/>
    <circle cx="760" cy="484" r="1.5" opacity="0.55"/><circle cx="830" cy="430" r="1.8" opacity="0.7"/>
    <circle cx="290" cy="492" r="1.7" opacity="0.6"/><circle cx="912" cy="496" r="1.4" opacity="0.5"/>
  </g>
  <g fill="#e0fbff" opacity="0.9">
    <circle cx="600" cy="404" r="2.6"/><circle cx="582" cy="418" r="1.8"/><circle cx="618" cy="416" r="1.7"/>
  </g>

  <!-- VIỀN TỐI 4 GÓC (tạo chiều sâu, giúp chữ đè lên đọc rõ) -->
  <rect width="1200" height="600" fill="none" stroke="#020a10" stroke-width="3" opacity="0.5"/>
  <path d="M0 0 L1200 0 L1200 96 Q600 40 0 96 Z" fill="#020a10" opacity="0.42"/>
  <path d="M0 600 L1200 600 L1200 508 Q600 566 0 508 Z" fill="#020a10" opacity="0.55"/>
  <path d="M0 0 L112 0 L0 128 Z" fill="#020a10" opacity="0.35"/>
  <path d="M1200 0 L1088 0 L1200 128 Z" fill="#020a10" opacity="0.35"/>
</svg>
