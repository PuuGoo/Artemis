  <!-- NÚI GIỮA (lớp 2) -->
  <path d="M0 412 L88 332 L170 384 L258 300 L350 372 L436 320 L528 392 L620 330 L712 386 L804 318 L896 380 L988 330 L1080 390 L1200 340 L1200 460 L0 460 Z"
