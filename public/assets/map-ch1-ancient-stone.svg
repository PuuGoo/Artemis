<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Ancient stone dungeon entrance">
  <defs>
    <linearGradient id="c1sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1a2b"/>
      <stop offset="38%" stop-color="#123049"/>
      <stop offset="68%" stop-color="#1a4a63"/>
      <stop offset="100%" stop-color="#2b6b78"/>
    </linearGradient>
    <radialGradient id="c1moon" cx="0.76" cy="0.17" r="0.2">
      <stop offset="0%" stop-color="#dff3ff" stop-opacity="1"/>
      <stop offset="35%" stop-color="#a8d8ef" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#7fb6d4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="c1far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e4256"/>
      <stop offset="100%" stop-color="#16323f"/>
    </linearGradient>
    <linearGradient id="c1mid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#17303d"/>
      <stop offset="100%" stop-color="#0e2029"/>
    </linearGradient>
    <linearGradient id="c1ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#25333c"/>
      <stop offset="55%" stop-color="#16222a"/>
      <stop offset="100%" stop-color="#0a1116"/>
    </linearGradient>
    <linearGradient id="c1gate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#04121c"/>
      <stop offset="60%" stop-color="#061a26"/>
      <stop offset="100%" stop-color="#0a2c3c"/>
    </linearGradient>
    <linearGradient id="c1beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8fe3ff" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#8fe3ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="c1fog" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9fd8ee" stop-opacity="0"/>
      <stop offset="45%" stop-color="#9fd8ee" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#9fd8ee" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="c1glow" cx="0.5" cy="0.62" r="0.42">
      <stop offset="0%" stop-color="#67e8f9" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#67e8f9" stop-opacity="0"/>
    </radialGradient>
    <filter id="c1soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="c1soft2" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
  </defs>

  <!-- BẦU TRỜI -->
  <rect width="1200" height="600" fill="url(#c1sky)"/>
  <circle cx="912" cy="102" r="150" fill="url(#c1moon)"/>
  <circle cx="912" cy="102" r="34" fill="#eafaff" opacity="0.92"/>
  <circle cx="912" cy="102" r="34" fill="#ffffff" opacity="0.35" filter="url(#c1soft2)"/>

  <!-- SAO -->
  <g fill="#dff3ff">
    <circle cx="120" cy="58" r="1.5" opacity="0.75"/><circle cx="228" cy="112" r="1.1" opacity="0.5"/>
    <circle cx="318" cy="46" r="1.7" opacity="0.85"/><circle cx="402" cy="140" r="1.2" opacity="0.55"/>
    <circle cx="500" cy="72" r="1.3" opacity="0.65"/><circle cx="588" cy="128" r="1" opacity="0.45"/>
    <circle cx="676" cy="52" r="1.6" opacity="0.8"/><circle cx="768" cy="152" r="1.1" opacity="0.5"/>
    <circle cx="1012" cy="66" r="1.4" opacity="0.7"/><circle cx="1096" cy="132" r="1.2" opacity="0.55"/>
    <circle cx="164" cy="172" r="1" opacity="0.42"/><circle cx="880" cy="196" r="1" opacity="0.4"/>
    <circle cx="1058" cy="204" r="1.3" opacity="0.6"/><circle cx="452" cy="188" r="0.9" opacity="0.35"/>
