  <!-- NÚI XA (lớp 1) -->
  <path d="M0 372 L96 262 L168 322 L262 214 L352 306 L438 236 L534 330 L628 252 L716 322 L810 246 L906 330 L1002 262 L1096 336 L1200 268 L1200 420 L0 420 Z"
