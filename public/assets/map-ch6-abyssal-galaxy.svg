<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-label="Bản đồ Chương 6: Vực Thẳm Thiên Hà">
  <defs>
    <radialGradient id="voidGlow" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#2b2560"/>
      <stop offset="45%" stop-color="#141235"/>
      <stop offset="100%" stop-color="#03030c"/>
    </radialGradient>
    <radialGradient id="nebulaA" cx="30%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity=".55"/>
      <stop offset="55%" stop-color="#0e7490" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#0e7490" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebulaB" cx="70%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity=".6"/>
      <stop offset="55%" stop-color="#5b21b6" stop-opacity=".24"/>
      <stop offset="100%" stop-color="#5b21b6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebulaC" cx="52%" cy="72%" r="45%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity=".32"/>
      <stop offset="60%" stop-color="#b45309" stop-opacity=".12"/>
      <stop offset="100%" stop-color="#b45309" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".98"/>
      <stop offset="35%" stop-color="#c7d2fe" stop-opacity=".7"/>
      <stop offset="100%" stop-color="#4338ca" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pathGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity=".05"/>
      <stop offset="50%" stop-color="#a78bfa" stop-opacity=".85"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity=".1"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="softer" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <!-- Nền vực thẳm -->
  <rect width="1200" height="600" fill="url(#voidGlow)"/>

  <!-- Tinh vân nhiều lớp -->
  <ellipse cx="330" cy="250" rx="300" ry="200" fill="url(#nebulaA)" filter="url(#softer)"/>
  <ellipse cx="820" cy="200" rx="290" ry="190" fill="url(#nebulaB)" filter="url(#softer)"/>
  <ellipse cx="640" cy="450" rx="330" ry="170" fill="url(#nebulaC)" filter="url(#softer)"/>

  <!-- Sao nền: ba lớp kích thước -->
  <g fill="#e0e7ff">
    <circle cx="72" cy="88" r="1.6" opacity=".95"/><circle cx="148" cy="40" r="1.1" opacity=".7"/>
    <circle cx="232" cy="132" r="1.9" opacity=".9"/><circle cx="318" cy="66" r="1.2" opacity=".65"/>
    <circle cx="404" cy="118" r="1.5" opacity=".85"/><circle cx="486" cy="52" r="1.0" opacity=".6"/>
    <circle cx="566" cy="104" r="1.8" opacity=".9"/><circle cx="648" cy="44" r="1.2" opacity=".7"/>
    <circle cx="730" cy="96" r="1.6" opacity=".88"/><circle cx="812" cy="60" r="1.1" opacity=".65"/>
    <circle cx="894" cy="126" r="1.9" opacity=".92"/><circle cx="976" cy="70" r="1.2" opacity=".7"/>
    <circle cx="1058" cy="130" r="1.5" opacity=".82"/><circle cx="1132" cy="86" r="1.1" opacity=".62"/>
    <circle cx="96" cy="212" r="1.3" opacity=".72"/><circle cx="188" cy="292" r="1.7" opacity=".86"/>
    <circle cx="272" cy="368" r="1.1" opacity=".6"/><circle cx="356" cy="440" r="1.8" opacity=".9"/>
    <circle cx="452" cy="512" r="1.2" opacity=".68"/><circle cx="548" cy="556" r="1.5" opacity=".8"/>
    <circle cx="654" cy="524" r="1.9" opacity=".9"/><circle cx="748" cy="468" r="1.1" opacity=".62"/>
    <circle cx="842" cy="396" r="1.6" opacity=".84"/><circle cx="936" cy="320" r="1.3" opacity=".72"/>
    <circle cx="1030" cy="248" r="1.8" opacity=".88"/><circle cx="1114" cy="180" r="1.2" opacity=".66"/>
  </g>
  <g fill="#a5b4fc" opacity=".55">
    <circle cx="120" cy="152" r="2.6"/><circle cx="300" cy="200" r="2.2"/>
    <circle cx="500" cy="150" r="2.8"/><circle cx="700" cy="210" r="2.3"/>
    <circle cx="900" cy="160" r="2.7"/><circle cx="1080" cy="220" r="2.2"/>
    <circle cx="200" cy="430" r="2.4"/><circle cx="430" cy="400" r="2.9"/>
    <circle cx="660" cy="430" r="2.2"/><circle cx="880" cy="390" r="2.6"/>
    <circle cx="1060" cy="420" r="2.3"/>
  </g>

  <!-- Dải Ngân Hà chéo -->
  <path d="M -60 520 C 220 430, 380 330, 620 290 C 880 245, 1040 170, 1270 120"
        stroke="url(#pathGlow)" stroke-width="86" fill="none" opacity=".5" filter="url(#softer)"/>
  <path d="M -60 520 C 220 430, 380 330, 620 290 C 880 245, 1040 170, 1270 120"
        stroke="#c7d2fe" stroke-width="1.4" fill="none" opacity=".28" stroke-dasharray="3 14"/>

  <!-- Đường đi giữa các vùng -->
  <path d="M 210 400 Q 330 330 420 268 T 640 300 T 850 232 T 1000 178"
        stroke="#818cf8" stroke-width="2.2" fill="none" opacity=".55" stroke-dasharray="9 8"/>

  <!-- Vùng 1: Cổng Tinh Vân -->
  <g>
    <circle cx="210" cy="400" r="62" fill="#22d3ee" opacity=".13" filter="url(#soft)"/>
    <circle cx="210" cy="400" r="34" fill="none" stroke="#67e8f9" stroke-width="2.4" opacity=".9"/>
    <circle cx="210" cy="400" r="22" fill="none" stroke="#a5f3fc" stroke-width="1.5" opacity=".7"
            stroke-dasharray="5 6"/>
    <circle cx="210" cy="400" r="9" fill="#ecfeff" opacity=".95"/>
  </g>

  <!-- Vùng 2: Ca Đoàn Băng Giá -->
  <g>
    <circle cx="420" cy="268" r="58" fill="#7dd3fc" opacity=".12" filter="url(#soft)"/>
    <path d="M 420 224 L 446 258 L 432 300 L 420 314 L 408 300 L 394 258 Z"
          fill="#bae6fd" opacity=".55" stroke="#e0f2fe" stroke-width="1.6"/>
    <path d="M 420 224 L 420 314 M 394 258 L 446 258" stroke="#f0f9ff" stroke-width="1"
          opacity=".55"/>
  </g>

  <!-- Vùng 3: Ngai Sao Lưu Lạc -->
  <g>
    <circle cx="640" cy="300" r="60" fill="#fbbf24" opacity=".14" filter="url(#soft)"/>
    <circle cx="640" cy="300" r="26" fill="#fde68a" opacity=".8"/>
    <path d="M 640 262 L 648 288 L 676 288 L 654 304 L 662 330 L 640 314 L 618 330 L 626 304 L 604 288 L 632 288 Z"
          fill="#fff7ed" opacity=".92"/>
  </g>

  <!-- Vùng 4: Tinh Vân Xoáy -->
  <g>
    <circle cx="850" cy="232" r="56" fill="#a78bfa" opacity=".14" filter="url(#soft)"/>
    <path d="M 850 232 m -26 0 a 26 26 0 1 1 52 0 a 20 20 0 1 1 -40 0 a 13 13 0 1 1 26 0"
          fill="none" stroke="#c4b5fd" stroke-width="2" opacity=".8"/>
    <circle cx="850" cy="232" r="6" fill="#ede9fe"/>
  </g>

  <!-- Vùng 5 (trùm): Vương Miện Vực Thẳm -->
  <g>
    <circle cx="1000" cy="178" r="90" fill="#818cf8" opacity=".2" filter="url(#softer)"/>
    <circle cx="1000" cy="178" r="58" fill="url(#coreGlow)"/>
    <circle cx="1000" cy="178" r="46" fill="none" stroke="#e0e7ff" stroke-width="2.6" opacity=".92"/>
    <circle cx="1000" cy="178" r="66" fill="none" stroke="#a5b4fc" stroke-width="1.6" opacity=".6"
            stroke-dasharray="10 9"/>
    <circle cx="1000" cy="178" r="30" fill="#02020a" opacity=".92"/>
    <circle cx="1000" cy="178" r="34" fill="none" stroke="#ffffff" stroke-width="2" opacity=".8"/>
    <!-- Vương miện gai -->
    <path d="M 964 202 L 972 166 L 982 190 L 992 154 L 1000 184 L 1008 154 L 1018 190 L 1028 166 L 1036 202"
          fill="none" stroke="#c7d2fe" stroke-width="2.4" stroke-linejoin="round" opacity=".9"/>
  </g>

  <!-- Nhãn -->
  <g font-family="Inter, system-ui, sans-serif" text-anchor="middle">
    <text x="210" y="470" fill="#a5f3fc" font-size="15" font-weight="800">CỔNG TINH VÂN</text>
    <text x="420" y="350" fill="#bae6fd" font-size="15" font-weight="800">CA ĐOÀN BĂNG GIÁ</text>
    <text x="640" y="378" fill="#fde68a" font-size="15" font-weight="800">NGAI SAO LƯU LẠC</text>
    <text x="850" y="306" fill="#c4b5fd" font-size="15" font-weight="800">TINH VÂN XOÁY</text>
    <text x="1000" y="286" fill="#e0e7ff" font-size="16" font-weight="900">VƯƠNG MIỆN VỰC THẲM</text>
    <text x="600" y="556" fill="#a5b4fc" font-size="13" font-weight="700" opacity=".8">
      CHƯƠNG 6 · VỰC THẲM THIÊN HÀ · 15 PHÒNG
    </text>
  </g>
</svg>
