    <!-- dòng chảy chính dẫn vào sâu -->
    <path d="M596 462 Q604 500 600 540 Q596 574 606 600 L630 600 Q618 572 622 540 Q626 500 618 464 Z"
          fill="url(#c2lava)" opacity="0.95"/>
  </g>

  <!-- QUẦNG SÁNG DUNG NHAM -->
  <ellipse cx="300" cy="500" rx="200" ry="52" fill="#fb923c" opacity="0.20" filter="url(#c2soft)"/>
  <ellipse cx="920" cy="534" rx="220" ry="46" fill="#fb923c" opacity="0.18" filter="url(#c2soft)"/>
  <ellipse cx="610" cy="540" rx="130" ry="60" fill="#fde68a" opacity="0.22" filter="url(#c2soft)"/>

  <!-- HỒ DUNG NHAM -->
  <ellipse cx="600" cy="536" rx="86" ry="26" fill="url(#c2pool)"/>
  <ellipse cx="600" cy="536" rx="52" ry="14" fill="#fde68a" opacity="0.55" filter="url(#c2soft2)"/>

  <!-- BỌT DUNG NHAM -->
  <g fill="#fde68a">
    <circle cx="566" cy="530" r="3.2" opacity="0.9"/><circle cx="618" cy="540" r="2.4" opacity="0.8"/>
    <circle cx="640" cy="528" r="2" opacity="0.7"/><circle cx="586" cy="546" r="2.2" opacity="0.75"/>
    <circle cx="298" cy="498" r="2.6" opacity="0.7"/><circle cx="336" cy="508" r="1.8" opacity="0.6"/>
    <circle cx="912" cy="530" r="2.4" opacity="0.65"/><circle cx="962" cy="542" r="1.9" opacity="0.6"/>
  </g>

  <!-- TÀN LỬA BAY -->
  <g fill="#fbbf24">
    <circle cx="486" cy="382" r="2.4" opacity="0.9"/><circle cx="524" cy="332" r="1.7" opacity="0.7"/>
    <circle cx="690" cy="352" r="2.1" opacity="0.8"/><circle cx="742" cy="292" r="1.5" opacity="0.6"/>
    <circle cx="356" cy="420" r="2" opacity="0.75"/><circle cx="838" cy="396" r="2.3" opacity="0.85"/>
    <circle cx="262" cy="356" r="1.6" opacity="0.6"/><circle cx="1006" cy="368" r="1.9" opacity="0.65"/>
    <circle cx="596" cy="288" r="1.8" opacity="0.65"/><circle cx="908" cy="252" r="1.5" opacity="0.55"/>
  </g>
  <g fill="#fff7ed">
    <circle cx="600" cy="530" r="3.4" opacity="0.85"/><circle cx="580" cy="518" r="2" opacity="0.6"/>
    <circle cx="624" cy="524" r="2.2" opacity="0.65"/>
  </g>

  <!-- ĐÁ ĐEN GẦN -->
  <g fill="#140705">
    <ellipse cx="386" cy="566" rx="34" ry="12"/>
    <ellipse cx="820" cy="580" rx="40" ry="14"/>
    <ellipse cx="214" cy="560" rx="26" ry="10"/>
    <ellipse cx="1006" cy="570" rx="30" ry="11"/>
    <ellipse cx="486" cy="592" rx="22" ry="8"/>
  </g>

  <!-- SƯƠNG TRO -->
  <rect x="0" y="404" width="1200" height="70" fill="url(#c2ash)"/>
  <rect x="0" y="470" width="1200" height="52" fill="url(#c2ash)" opacity="0.7"/>

  <!-- VIỀN TỐI -->
  <path d="M0 0 L1200 0 L1200 96 Q600 40 0 96 Z" fill="#0b0403" opacity="0.45"/>
  <path d="M0 600 L1200 600 L1200 506 Q600 566 0 506 Z" fill="#0b0403" opacity="0.58"/>
  <path d="M0 0 L112 0 L0 128 Z" fill="#0b0403" opacity="0.4"/>
  <path d="M1200 0 L1088 0 L1200 128 Z" fill="#0b0403" opacity="0.4"/>
  <rect width="1200" height="600" fill="none" stroke="#0b0403" stroke-width="3" opacity="0.45"/>
</svg>
