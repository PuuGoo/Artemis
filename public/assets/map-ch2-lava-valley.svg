  <!-- ĐÁ NHÔ -->
  <g fill="#1a0806">
    <path d="M156 486 L172 402 L192 398 L208 486 Z"/>
    <path d="M172 402 L182 372 L192 398 Z" fill="#2d110d"/>
    <path d="M1012 486 L1026 414 L1046 410 L1060 486 Z"/>
    <path d="M1026 414 L1036 384 L1046 410 Z" fill="#2d110d"/>
  </g>

  <!-- MẶT ĐẤT NỨT NẺ -->
  <path d="M0 470 Q300 446 600 462 Q900 478 1200 452 L1200 600 L0 600 Z" fill="url(#c2ground)"/>

  <!-- KHE NỨT DUNG NHAM -->
  <g>
    <path d="M0 486 Q180 470 340 494 Q420 506 470 500 Q520 494 566 512 L560 526 Q512 510 468 516 Q420 522 344 512 Q184 490 0 504 Z"
